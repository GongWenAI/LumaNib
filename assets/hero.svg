<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">LumaNib — Make every point clear.</title><desc id="desc">A cyan and orange split ring with a glowing pen stroke on a dark background. Mouse highlight and screen pen for macOS and Windows.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#090c13"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#14bdd7" stop-opacity=".14"/><stop offset="1" stop-color="#14bdd7" stop-opacity="0"/></radialGradient>
 <linearGradient id="line"><stop stop-color="#28d9f3"/><stop offset=".6" stop-color="#4becbe"/><stop offset="1" stop-color="#ff9b45"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1440" height="520" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1438" height="518" rx="27" fill="none" stroke="#27303d"/>
<circle cx="1130" cy="225" r="260" fill="url(#halo)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
 <text x="82" y="82" fill="#65dcec" font-size="15" letter-spacing="3">MOUSE HIGHLIGHT + SCREEN PEN</text>
 <text x="76" y="202" fill="#f3f6fa" font-size="100" font-weight="700" letter-spacing="-4">LumaNib</text>
 <text x="82" y="266" fill="#e4e9ef" font-size="34">Make every point clear.</text>
 <text x="82" y="313" fill="#9ba9ba" font-size="21">Highlight clicks. Draw with light. Keep explaining.</text>
 <g fill="#101d28" stroke="#304352"><rect x="82" y="373" width="112" height="38" rx="19"/><rect x="205" y="373" width="122" height="38" rx="19"/><rect x="338" y="373" width="137" height="38" rx="19"/></g>
 <g fill="#cedae6" font-size="15" text-anchor="middle"><text x="138" y="398">macOS</text><text x="266" y="398">Windows</text><text x="406" y="398">Free to use</text></g>
 <text x="82" y="466" fill="#647587" font-size="14">1.59  /  ENGLISH + CHINESE</text>
</g>
<g fill="none" stroke-linecap="round" stroke-width="19">
 <path d="M1110 100 A122 122 0 0 0 1110 340" stroke="#28d9f3" filter="url(#glow)"/>
 <path d="M1150 100 A122 122 0 0 1 1150 340" stroke="#ff913b" filter="url(#glow)"/>
 <path d="M1110 100 A122 122 0 0 0 1110 340" stroke="#28d9f3"/>
 <path d="M1150 100 A122 122 0 0 1 1150 340" stroke="#ff913b"/>
</g>
<path d="M940 427 C1010 373 1014 462 1077 422 S1170 393 1212 420 S1300 429 1335 389" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
<path d="M940 427 C1010 373 1014 462 1077 422 S1170 393 1212 420 S1300 429 1335 389" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
</svg>
